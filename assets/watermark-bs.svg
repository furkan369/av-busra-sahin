<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Parlak Gümüş & Krom Yansıma Degradesi -->
    <linearGradient id="wmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#F8FAFC"/>
      <stop offset="36%" stop-color="#CBD5E1"/>
      <stop offset="52%" stop-color="#64748B"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Halka İçin Özel Parlak Platin Degradesi -->
    <linearGradient id="ringSilverGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F1F5F9"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Metalik Gümüş Işıltı & Gölge Filtresi -->
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#FFFFFF" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#silverGlow)">
    <circle cx="300" cy="300" r="265" fill="none" stroke="url(#ringSilverGrad)" stroke-width="8"/>
    <circle cx="300" cy="300" r="252" fill="none" stroke="url(#ringSilverGrad)" stroke-width="3"/>

    <!-- B Harfi -->
    <path d="M 160 145 L 225 145 C 275 145 305 168 305 210 C 305 240 285 262 255 272 C 295 282 322 310 322 355 C 322 410 278 440 220 440 L 160 440 Z M 198 178 L 198 268 L 228 268 C 256 268 274 254 274 223 C 274 192 256 178 228 178 Z M 198 296 L 198 407 L 224 407 C 258 407 288 390 288 351 C 288 312 258 296 224 296 Z" fill="url(#wmGrad)"/>

    <!-- Ş Harfi -->
    <path d="M 440 185 C 425 155 390 140 345 145 C 295 152 270 185 285 225 C 300 265 415 285 418 360 C 420 415 375 448 315 448 C 265 448 230 425 215 395" fill="none" stroke="url(#wmGrad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 335 455 C 348 478 338 498 320 504 C 302 510 290 500 296 485 C 302 470 324 470 330 455" fill="none" stroke="url(#wmGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Adalet Terazisi -->
    <g transform="translate(325, 335)">
      <line x1="0" y1="-62" x2="0" y2="42" stroke="url(#wmGrad)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="-65" r="6" fill="#FFFFFF"/>
      <path d="M -68 -48 C -35 -54 35 -54 68 -48" fill="none" stroke="url(#wmGrad)" stroke-width="5" stroke-linecap="round"/>
      <line x1="-68" y1="-48" x2="-86" y2="-10" stroke="url(#wmGrad)" stroke-width="2.4"/>
      <line x1="-68" y1="-48" x2="-50" y2="-10" stroke="url(#wmGrad)" stroke-width="2.4"/>
      <path d="M -90 -10 C -90 10 -46 10 -46 -10 Z" fill="url(#wmGrad)"/>
      <line x1="68" y1="-48" x2="50" y2="-10" stroke="url(#wmGrad)" stroke-width="2.4"/>
      <line x1="68" y1="-48" x2="86" y2="-10" stroke="url(#wmGrad)" stroke-width="2.4"/>
      <path d="M 46 -10 C 46 10 90 10 90 -10 Z" fill="url(#wmGrad)"/>
    </g>
  </g>
</svg>